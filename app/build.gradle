plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('local.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def mzStoreFile = { ->
    def p = keystoreProperties.getProperty('mz.storeFile')
    if (p != null && !p.isBlank()) return file(p)
    def env = System.getenv('MZ_STORE_FILE')
    if (env != null && !env.isBlank()) return file(env)
    null
}

def mzStorePassword = System.getenv('MZ_STORE_PASSWORD') ?: keystoreProperties.getProperty('mz.storePassword')
def mzKeyAlias = System.getenv('MZ_KEY_ALIAS') ?: keystoreProperties.getProperty('mz.keyAlias')
def mzKeyPassword = System.getenv('MZ_KEY_PASSWORD') ?: keystoreProperties.getProperty('mz.keyPassword')

android {
    signingConfigs {
        release {
            def store = mzStoreFile()
            if (store != null && store.isFile() && mzStorePassword && mzKeyAlias && mzKeyPassword) {
                storeFile store
                storePassword mzStorePassword
                keyAlias mzKeyAlias
                keyPassword mzKeyPassword
            }
        }
    }
    compileSdk = 36

    defaultConfig {
        applicationId = "com.nagtime.mz_renew"
        minSdk = 31
        targetSdk = 36
        versionCode = 13
        versionName = "4.0.2"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig = signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    buildFeatures {
        viewBinding = true
        dataBinding = true
    }
    namespace = 'com.nagtime.mz_renew'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    //noinspection NotInterpolated
}

